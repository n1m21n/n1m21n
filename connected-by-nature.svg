    <circle cx="50" cy="50" r="1.2" class="grid-dot"/><circle cx="110" cy="50" r="1.2" class="grid-dot"/><circle cx="170" cy="50" r="1.2" class="grid-dot"/><circle cx="230" cy="50" r="1.2" class="grid-dot"/><circle cx="290" cy="50" r="1.2" class="grid-dot"/><circle cx="350" cy="50" r="1.2" class="grid-dot"/><circle cx="410" cy="50" r="1.2" class="grid-dot"/><circle cx="470" cy="50" r="1.2" class="grid-dot"/><circle cx="530" cy="50" r="1.2" class="grid-dot"/><circle cx="590" cy="50" r="1.2" class="grid-dot"/><circle cx="650" cy="50" r="1.2" class="grid-dot"/><circle cx="710" cy="50" r="1.2" class="grid-dot"/><circle cx="770" cy="50" r="1.2" class="grid-dot"/><circle cx="830" cy="50" r="1.2" class="grid-dot"/>
    <circle cx="50" cy="110" r="1.2" class="grid-dot"/><circle cx="170" cy="110" r="1.2" class="grid-dot"/><circle cx="230" cy="110" r="1.2" class="grid-dot"/><circle cx="290" cy="110" r="1.2" class="grid-dot"/><circle cx="350" cy="110" r="1.2" class="grid-dot"/><circle cx="410" cy="110" r="1.2" class="grid-dot"/><circle cx="470" cy="110" r="1.2" class="grid-dot"/><circle cx="530" cy="110" r="1.2" class="grid-dot"/><circle cx="590" cy="110" r="1.2" class="grid-dot"/><circle cx="650" cy="110" r="1.2" class="grid-dot"/><circle cx="710" cy="110" r="1.2" class="grid-dot"/><circle cx="830" cy="110" r="1.2" class="grid-dot"/>
    <circle cx="50" cy="170" r="1.2" class="grid-dot"/><circle cx="170" cy="170" r="1.2" class="grid-dot"/><circle cx="230" cy="170" r="1.2" class="grid-dot"/><circle cx="350" cy="170" r="1.2" class="grid-dot"/><circle cx="410" cy="170" r="1.2" class="grid-dot"/><circle cx="470" cy="170" r="1.2" class="grid-dot"/><circle cx="530" cy="170" r="1.2" class="grid-dot"/><circle cx="650" cy="170" r="1.2" class="grid-dot"/><circle cx="710" cy="170" r="1.2" class="grid-dot"/><circle cx="830" cy="170" r="1.2" class="grid-dot"/>
    <circle cx="50" cy="230" r="1.2" class="grid-dot"/><circle cx="110" cy="230" r="1.2" class="grid-dot"/><circle cx="170" cy="230" r="1.2" class="grid-dot"/><circle cx="230" cy="230" r="1.2" class="grid-dot"/><circle cx="290" cy="230" r="1.2" class="grid-dot"/><circle cx="350" cy="230" r="1.2" class="grid-dot"/><circle cx="530" cy="230" r="1.2" class="grid-dot"/><circle cx="590" cy="230" r="1.2" class="grid-dot"/><circle cx="650" cy="230" r="1.2" class="grid-dot"/><circle cx="710" cy="230" r="1.2" class="grid-dot"/><circle cx="770" cy="230" r="1.2" class="grid-dot"/><circle cx="830" cy="230" r="1.2" class="grid-dot"/>
    <circle cx="50" cy="290" r="1.2" class="grid-dot"/><circle cx="170" cy="290" r="1.2" class="grid-dot"/><circle cx="230" cy="290" r="1.2" class="grid-dot"/><circle cx="350" cy="290" r="1.2" class="grid-dot"/><circle cx="410" cy="290" r="1.2" class="grid-dot"/><circle cx="470" cy="290" r="1.2" class="grid-dot"/><circle cx="530" cy="290" r="1.2" class="grid-dot"/><circle cx="650" cy="290" r="1.2" class="grid-dot"/><circle cx="710" cy="290" r="1.2" class="grid-dot"/><circle cx="830" cy="290" r="1.2" class="grid-dot"/>
    <circle cx="50" cy="350" r="1.2" class="grid-dot"/><circle cx="170" cy="350" r="1.2" class="grid-dot"/><circle cx="230" cy="350" r="1.2" class="grid-dot"/><circle cx="350" cy="350" r="1.2" class="grid-dot"/><circle cx="410" cy="350" r="1.2" class="grid-dot"/><circle cx="470" cy="350" r="1.2" class="grid-dot"/><circle cx="530" cy="350" r="1.2" class="grid-dot"/><circle cx="650" cy="350" r="1.2" class="grid-dot"/><circle cx="710" cy="350" r="1.2" class="grid-dot"/><circle cx="830" cy="350" r="1.2" class="grid-dot"/>
    <circle cx="50" cy="400" r="1.2" class="grid-dot"/><circle cx="110" cy="400" r="1.2" class="grid-dot"/><circle cx="170" cy="400" r="1.2" class="grid-dot"/><circle cx="230" cy="400" r="1.2" class="grid-dot"/><circle cx="290" cy="400" r="1.2" class="grid-dot"/><circle cx="350" cy="400" r="1.2" class="grid-dot"/><circle cx="410" cy="400" r="1.2" class="grid-dot"/><circle cx="470" cy="400" r="1.2" class="grid-dot"/><circle cx="530" cy="400" r="1.2" class="grid-dot"/><circle cx="590" cy="400" r="1.2" class="grid-dot"/><circle cx="650" cy="400" r="1.2" class="grid-dot"/><circle cx="710" cy="400" r="1.2" class="grid-dot"/><circle cx="770" cy="400" r="1.2" class="grid-dot"/><circle cx="830" cy="400" r="1.2" class="grid-dot"/>
  </g>

  <!-- Header Title -->
  <text x="440" y="52" text-anchor="middle">
    <tspan class="title-text">Connected by </tspan>
    <tspan class="cursive-text">Nature</tspan>
  </text>

  <!-- Connecting Mesh Lines -->
  <g>
    <!-- Secondary faint lines -->
    <line x1="105" y1="165" x2="620" y2="350" class="line-secondary"/>
    <line x1="105" y1="165" x2="775" y2="360" class="line-secondary"/>
    <line x1="95" y1="345" x2="615" y2="190" class="line-secondary"/>
    <line x1="95" y1="345" x2="770" y2="150" class="line-secondary"/>
    <line x1="260" y1="190" x2="775" y2="360" class="line-secondary"/>
    <line x1="285" y1="350" x2="770" y2="150" class="line-secondary"/>
    <line x1="260" y1="190" x2="620" y2="350" class="line-secondary"/>
    <line x1="285" y1="350" x2="615" y2="190" class="line-secondary"/>

    <!-- Primary lines -->
