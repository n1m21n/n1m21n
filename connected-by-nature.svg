    <line x1="105" y1="165" x2="260" y2="190" class="line-primary"/>
    <line x1="105" y1="165" x2="440" y2="245" class="line-primary"/>
    <line x1="95" y1="345" x2="285" y2="350" class="line-primary"/>
    <line x1="260" y1="190" x2="285" y2="350" class="line-primary"/>
    <line x1="260" y1="190" x2="440" y2="245" class="line-primary"/>
    <line x1="285" y1="350" x2="440" y2="245" class="line-primary"/>
    <line x1="285" y1="350" x2="620" y2="350" class="line-primary"/>
    <line x1="440" y1="245" x2="615" y2="190" class="line-primary"/>
    <line x1="440" y1="245" x2="620" y2="350" class="line-primary"/>
    <line x1="440" y1="245" x2="770" y2="150" class="line-primary"/>
    <line x1="440" y1="245" x2="775" y2="360" class="line-primary"/>
    <line x1="615" y1="190" x2="770" y2="150" class="line-primary"/>
    <line x1="615" y1="190" x2="775" y2="360" class="line-primary"/>
    <line x1="620" y1="350" x2="775" y2="360" class="line-primary"/>
    <line x1="770" y1="150" x2="775" y2="360" class="line-primary"/>
  </g>

  <!-- Constellation Pulses & Small Particles -->
  <g>
    <circle cx="160" cy="174" r="2.5" fill="#c2593f" opacity="0.75"/>
    <circle cx="100" cy="245" r="2.2" fill="#d97736" opacity="0.6"/>
    <circle cx="190" cy="348" r="2.5" fill="#c2593f" opacity="0.7"/>
    <circle cx="270" cy="265" r="2.8" fill="#5a6b7c" opacity="0.65"/>
    <circle cx="340" cy="215" r="2.2" fill="#5a6b7c" opacity="0.8"/>
    <circle cx="360" cy="295" r="2.5" fill="#c2593f" opacity="0.7"/>
    <circle cx="485" cy="272" r="3.0" fill="#b8860b" opacity="0.75"/>
    <circle cx="530" cy="216" r="2.2" fill="#d97736" opacity="0.7"/>
    <circle cx="550" cy="305" r="2.6" fill="#c2593f" opacity="0.65"/>
    <circle cx="530" cy="350" r="2.4" fill="#2563eb" opacity="0.7"/>
    <circle cx="690" cy="168" r="2.5" fill="#d97736" opacity="0.8"/>
    <circle cx="705" cy="155" r="2.2" fill="#4d7c67" opacity="0.75"/>
    <circle cx="700" cy="355" r="2.6" fill="#2563eb" opacity="0.75"/>
    <circle cx="773" cy="250" r="2.4" fill="#4d7c67" opacity="0.65"/>
    <circle cx="617" cy="275" r="2.2" fill="#2563eb" opacity="0.6"/>
  </g>

  <!-- Interactive / Styled Node Badges -->
  
  <!-- 1. Sound (x: 105, y: 165) -->
  <g transform="translate(62, 148)" filter="url(#shadow)">
    <rect class="node-pill" width="86" height="34" rx="17" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#c2593f"/>
    <text class="node-label" x="30" y="22">Sound</text>
  </g>

  <!-- 2. Music (x: 95, y: 345) -->
  <g transform="translate(54, 328)" filter="url(#shadow)">
    <rect class="node-pill" width="82" height="34" rx="17" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#d97736"/>
    <text class="node-label" x="30" y="22">Music</text>
  </g>

  <!-- 3. Physics (x: 260, y: 190) -->
  <g transform="translate(214, 173)" filter="url(#shadow)">
    <rect class="node-pill" width="92" height="34" rx="17" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#5a6b7c"/>
    <text class="node-label" x="30" y="22">Physics</text>
  </g>

  <!-- 4. Math (x: 285, y: 350) -->
  <g transform="translate(247, 333)" filter="url(#shadow)">
    <rect class="node-pill" width="76" height="34" rx="17" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#c2593f"/>
    <text class="node-label" x="30" y="22">Math</text>
  </g>

  <!-- 5. Art (Center) (x: 440, y: 245) -->
  <g transform="translate(407, 228)" filter="url(#shadow)">
    <rect class="node-pill" width="66" height="34" rx="17" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#b8860b"/>
    <text class="node-label" x="30" y="22">Art</text>
  </g>

  <!-- 6. Light (x: 615, y: 190) -->
  <g transform="translate(576, 173)" filter="url(#shadow)">
    <rect class="node-pill" width="78" height="34" rx="17" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#d97736"/>
    <text class="node-label" x="30" y="22">Light</text>
  </g>

  <!-- 7. Motion (x: 620, y: 350) -->
  <g transform="translate(575, 333)" filter="url(#shadow)">
    <rect class="node-pill" width="90" height="34" rx="17" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#2563eb"/>
    <text class="node-label" x="30" y="22">Motion</text>
  </g>

  <!-- 8. Geometry (x: 770, y: 150) -->
  <g transform="translate(718, 133)" filter="url(#shadow)">
    <rect class="node-pill" width="104" height="34" rx="17" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#4d7c67"/>
    <text class="node-label" x="30" y="22">Geometry</text>
  </g>

  <!-- 9. Color (x: 775, y: 360) -->
