<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%">
  <defs>
    <style>
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 700; }
      .cursive-text { font-family: 'Caveat', 'Brush Script MT', 'Segoe Script', cursive, sans-serif; font-size: 34px; font-weight: 600; font-style: italic; fill: #c2593f; }
      .node-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; }
      .grid-dot { fill: rgba(150, 150, 150, 0.12); }
      .line-primary { stroke: rgba(160, 160, 160, 0.28); stroke-width: 1.2; }
      .line-secondary { stroke: rgba(160, 160, 160, 0.12); stroke-width: 0.9; }
      
      @media (prefers-color-scheme: dark) {
        .bg-rect { fill: #0d1117; stroke: rgba(255, 255, 255, 0.1); }
        .title-text { fill: #f0f6fc; }
        .node-pill { fill: #161b22; stroke: rgba(255, 255, 255, 0.15); }
        .node-label { fill: #e6edf3; }
        .line-primary { stroke: rgba(200, 200, 200, 0.22); }
        .line-secondary { stroke: rgba(200, 200, 200, 0.08); }
        .grid-dot { fill: rgba(255, 255, 255, 0.07); }
      }
      @media (prefers-color-scheme: light) {
        .bg-rect { fill: #fbfaf6; stroke: rgba(45, 35, 25, 0.1); }
        .title-text { fill: #1f1d1a; }
        .node-pill { fill: #ffffff; stroke: rgba(45, 35, 25, 0.12); }
        .node-label { fill: #1f1d1a; }
        .line-primary { stroke: rgba(45, 35, 25, 0.20); }
        .line-secondary { stroke: rgba(45, 35, 25, 0.08); }
        .grid-dot { fill: rgba(45, 35, 25, 0.06); }
      }
    </style>
    <filter id="shadow" x="-8%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect class="bg-rect" width="880" height="430" rx="16" stroke-width="1"/>

  <!-- Dot Grid Pattern -->
  <g>
